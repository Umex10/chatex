# ==========================================
# Data Source – H2 in-memory database
# ==========================================

# JDBC URL: creates an in-memory DB named "testdb"; DB_CLOSE_DELAY=-1 keeps it alive until the JVM exits
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# JDBC driver class for H2
spring.datasource.driverClassName=org.h2.Driver

# Default H2 username (no password needed for tests)
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================

# Tell Hibernate to generate H2-compatible SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create tables on startup and drop them on shutdown (clean state per test run)
spring.jpa.hibernate.ddl-auto=create-drop

# Print every SQL statement Hibernate executes to the console
spring.jpa.show-sql=true

# Print the actual parameter values bound to SQL prepared statements (TRACE level)
logging.level.org.hibernate.orm.jdbc.bind=trace

# Print data-source connection events (acquire, release) for debugging
logging.level.org.springframework.jdbc.datasource=DEBUG